<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-label="Deem Almaneea pink animated developer profile banner">
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#170d26"/><stop offset=".55" stop-color="#301335"/><stop offset="1" stop-color="#4c184d"/></linearGradient>
<linearGradient id="pink" x2="1"><stop stop-color="#ff8fcf"/><stop offset=".55" stop-color="#ffb7df"/><stop offset="1" stop-color="#c6a5ff"/></linearGradient>
<radialGradient id="orb"><stop stop-color="#ffb6e0" stop-opacity=".28"/><stop offset="1" stop-color="#ffb6e0" stop-opacity="0"/></radialGradient>
<pattern id="stars" width="70" height="70" patternUnits="userSpaceOnUse"><circle cx="12" cy="19" r="1.2" fill="#fbcfe8" opacity=".35"/><circle cx="53" cy="51" r="1" fill="#e9d5ff" opacity=".25"/></pattern>
</defs>
<style>
.t{font-family:Consolas,'Liberation Mono',monospace}
.float{animation:float 4s ease-in-out infinite}.spin{transform-origin:824px 210px;animation:spin 22s linear infinite}.spin2{transform-origin:824px 210px;animation:spin 15s linear infinite reverse}
.blink{animation:blink 1.1s steps(1) infinite}.spark{animation:spark 2.8s ease-in-out infinite alternate}.line{stroke-dasharray:650;stroke-dashoffset:650;animation:draw 2.8s ease forwards}
@keyframes float{50%{transform:translateY(-8px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{50%{opacity:0}}@keyframes spark{to{opacity:.25;transform:scale(.85)}}@keyframes draw{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.float,.spin,.spin2,.blink,.spark,.line{animation:none;stroke-dashoffset:0}}
</style>
<rect width="1000" height="420" rx="25" fill="url(#bg)"/>
<rect width="1000" height="420" rx="25" fill="url(#stars)"/>
<rect x="2" y="2" width="996" height="416" rx="23" stroke="#e879b8" stroke-opacity=".55" stroke-width="2" fill="none"/>
<rect x="22" y="20" width="956" height="380" rx="17" stroke="#f9a8d4" stroke-opacity=".24" fill="#160d27" fill-opacity=".24"/>
<circle cx="48" cy="43" r="7" fill="#fb7185"/><circle cx="72" cy="43" r="7" fill="#f9a8d4"/><circle cx="96" cy="43" r="7" fill="#c4b5fd"/>
<text x="500" y="49" text-anchor="middle" fill="#fbcfe8" font-size="17" class="t">deem@pinkverse: ~/developer</text>
<path d="M23 67H977" stroke="#f9a8d4" stroke-opacity=".3"/>
<text x="52" y="115" fill="#f9a8d4" font-size="19" class="t">$ hello_world.py</text>
<text x="48" y="180" fill="#fff1f8" font-size="49" font-weight="bold" class="t">DEEM ALMANEEA</text>
<path d="M52 197H669" stroke="url(#pink)" stroke-width="4" class="line"/>
<text x="52" y="241" fill="#ffd0eb" font-size="20" class="t">Computer Science Student</text>
<text x="52" y="278" fill="#e9c8ff" font-size="19" class="t">AI  ✦  Software  ✦  Cybersecurity</text>
<text x="52" y="344" fill="#ff9ed8" font-size="19" class="t">$ dream. code. create.</text>
<rect x="299" y="325" width="12" height="24" fill="#ffb0dc" class="blink"/>
<circle cx="824" cy="210" r="160" fill="url(#orb)"/>
<g class="float">
<circle cx="824" cy="210" r="110" fill="#51224f" fill-opacity=".5" stroke="#ffaddd" stroke-opacity=".5"/>
<circle cx="824" cy="210" r="98" fill="none" stroke="#f9a8d4" stroke-dasharray="5 13" stroke-width="2" class="spin"/>
<circle cx="824" cy="210" r="121" fill="none" stroke="#d8b4fe" stroke-dasharray="29 17 5 17" stroke-width="2" class="spin2"/>
<path d="M784 177Q784 146 824 146Q864 146 864 177V226Q864 268 824 268Q784 268 784 226Z" fill="#fbcfe8" stroke="#ff8fca" stroke-width="3"/>
<path d="M790 172Q824 139 858 172" fill="none" stroke="#c084fc" stroke-width="9" stroke-linecap="round"/>
<circle cx="807" cy="210" r="5.5" fill="#7e225f"/><circle cx="841" cy="210" r="5.5" fill="#7e225f"/>
<path d="M811 231Q824 243 837 231" stroke="#a43886" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="781" cy="181" r="10" fill="#f9a8d4"/><circle cx="867" cy="181" r="10" fill="#f9a8d4"/>
<path d="M812 147L824 132L836 147" fill="#f9a8d4"/>
</g>
<g fill="#ffd1ec" class="spark"><path d="M720 116L725 128L737 133L725 138L720 150L715 138L703 133L715 128Z"/><path d="M940 283L944 293L954 297L944 301L940 311L936 301L926 297L936 293Z"/></g>
<text x="824" y="365" text-anchor="middle" fill="#ffcae8" font-size="15" class="t">✦ made of code &amp; a little magic ✦</text>
</svg>